# ==============================================================================
# tmux 生产力配置 (专为 Claude Code & 开发环境优化)
# ==============================================================================

# ----------------- 1. 基础按键与前缀键 -----------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# ----------------- 2. 交互体验与通用设置 -----------------
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 100000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g allow-rename off
setw -g automatic-rename off

# 关闭窗格不弹确认提示 (按 Prefix + x 直接秒关)
bind x kill-pane

# ----------------- 3. 颜色与真彩色支持 -----------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",*:Tc"
# 同步输出(DECSET 2026):tmux 重画客户端时用 ?2026h/l 包住,Ghostty 一帧内整体呈现,中途不显示光标乱跳。
# 需要它是因为 Codex TUI 每秒发几十帧 2026 包住的画面,tmux 收到每帧都整屏重画一次 pane(~7KB);
# tmux 没把 Ghostty 认成支持 sync 的终端,不加这行它的重画就裸露出去——光标狂闪、输入法候选框跟着乱跳。
# 只在客户端 attach 时生效:改完要 detach 再 tmux a。(biai 2026-09-13 加,2026-09-17 合入正本)
# 2026-09-17 曾判断"tz 不开 extended-keys 也正常"(未合入 biai 的该项),09-18 发现 tz 的
# Shift+Enter 已不能在 tmux 里正确换行——按下等同 Enter,直接提交。extended-keys 是 tmux
# 把终端发来的修饰键序列(含 Shift+Enter 的 CSI u 编码)原样转发给 pane 内程序的开关,
# 默认关闭且不会仅凭 TERM=xterm-256color 自动探测到,需要显式打开。
# on 依赖 pane 内应用请求扩展模式；Codex 当前窗格为 VT10x。
# always 强制至少 mode 1，并以 CSI-u 编码保留 Shift+Enter 的修饰键。
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-256color:sync:extkeys"

# ----------------- 4. 直观分屏与导航（上下左右方向键） -----------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

# 使用方向键切换分屏 (Prefix + 上下左右，支持快速连按)
bind -r Left select-pane -L
bind -r Down select-pane -D
bind -r Up select-pane -U
bind -r Right select-pane -R

# 使用 Shift + 方向键调整分屏大小
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5
bind -r S-Right resize-pane -R 5

# ----------------- 5. 复制模式与剪贴板 -----------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
set -s set-clipboard on

# ----------------- 6. 现代极简状态栏 -----------------
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#a6adc8"

# 左侧：Session 名称 & Prefix 激活指示器
set -g status-left-length 50
set -g status-left "#{?client_prefix,#[bg=#f9e2af]#[fg=#11111b]#[bold]  PREFIX #[default],#[bg=#313244]#[fg=#cdd6f4]#[bold]  #S #[default]} "

set -g status-justify left
# 窗口标签:名字后依次是——
#   ⊞N 分屏数徽标(只在分屏数>1 时显示)  黄色Z(有分屏被最大化 zoom)
#   彩色点 = 各分屏中 Claude 的状态,按分屏顺序逐个渲染
#   (由 ~/.claude/tmux-claude-hook.sh 写入分屏变量 @claude_state):
#   青●干活中  黄●等你输入/授权  绿●回合完成;没跑 Claude 的分屏不显示点
#   Codex 使用独立的 @codex_state，显示为菱形，避免覆盖 Claude 的状态点:
#   青◆干活中  黄◆等授权  绿◆回合完成;没跑 Codex 的分屏不显示菱形
#   点/菱形后面的数字 = 当前状态持续了多久(青=这一阵跑了多久 黄=等你多久 绿=做完晾了多久),
#   分钟粒度、不足 1 分钟不显示、等你超 10 分钟变黄;由 ~/.claude/tmux-claude-age.sh 每 2 秒算好
#   写进 @claude_age / @codex_age(起点由两个钩子在状态切换时记录)。
#   干活中的青点/青菱形每 2 秒在实心与空心之间交替(闪 = 正在工作),开关 @blink 也由该脚本翻。
#   响应式(2026-09-14):终端窄于 90 列(第 4 级)时,⊞N 徽标和状态时长数字一起隐藏,只留状态点;
#   右侧额度块的逐级隐藏(150/130/110 列砍重置时刻/预测/Codex,70 列以下整段隐藏)在 tmux-claude-usage.sh 里,
#   通过 status-right 把 #{client_width} 传给它。多客户端各按各自宽度渲染。
setw -g window-status-format "#[fg=#6c7086]#[bg=#1e1e2e] #I:#W#{?#{&&:#{>:#{window_panes},1},#{e|>=:#{client_width},90}}, ⊞#{window_panes},}#{?window_zoomed_flag,#[fg=#f9e2af]Z,}#{P:#{?#{==:#{@claude_state},wait}, #[fg=#f9e2af]●,#{?#{==:#{@claude_state},busy}, #[fg=#89dceb]#{?#{==:#{@blink},1},●,○},#{?#{==:#{@claude_state},done}, #[fg=#a6e3a1]●,}}}#{?#{e|>=:#{client_width},90},#{?#{@claude_age},#[fg=#6c7086] #{@claude_age},},}#{?#{==:#{@codex_state},wait}, #[fg=#f9e2af]◆,#{?#{==:#{@codex_state},busy}, #[fg=#89dceb]#{?#{==:#{@blink},1},◆,◇},#{?#{==:#{@codex_state},done}, #[fg=#a6e3a1]◆,}}}#{?#{e|>=:#{client_width},90},#{?#{@codex_age},#[fg=#6c7086] #{@codex_age},},}}#[fg=#6c7086]#[bg=#1e1e2e] "
setw -g window-status-current-format "#[fg=#11111b]#[bg=#89b4fa]#[bold] #I:#W#{?#{&&:#{>:#{window_panes},1},#{e|>=:#{client_width},90}}, ⊞#{window_panes},}#{?window_zoomed_flag,#[fg=#b8860b]Z,}#{P:#{?#{==:#{@claude_state},wait}, #[fg=#f9e2af]●,#{?#{==:#{@claude_state},busy}, #[fg=#89dceb]#{?#{==:#{@blink},1},●,○},#{?#{==:#{@claude_state},done}, #[fg=#a6e3a1]●,}}}#{?#{e|>=:#{client_width},90},#{?#{@claude_age},#[fg=#11111b] #{@claude_age},},}#{?#{==:#{@codex_state},wait}, #[fg=#f9e2af]◆,#{?#{==:#{@codex_state},busy}, #[fg=#89dceb]#{?#{==:#{@blink},1},◆,◇},#{?#{==:#{@codex_state},done}, #[fg=#a6e3a1]◆,}}}#{?#{e|>=:#{client_width},90},#{?#{@codex_age},#[fg=#11111b] #{@codex_age},},}} #[default]"
setw -g window-status-separator ""

# 右侧:先跑一次状态时长计时器(tmux-claude-age.sh,无输出),再接 Codex(蓝底)与 Claude(橙底)额度;
# 两块靠颜色区分,不显示产品名称和本地时钟。
# 额度脚本的参数是当前客户端列数,窄屏时它自己按级缩减(见上方窗口标签注释)。
set -g status-right-length 180
set -g status-right "#(bash ~/.claude/tmux-claude-age.sh)#(bash ~/.claude/tmux-claude-usage.sh #{client_width})"

# 2026-09-17：状态栏改为与 biai（wangzp 用户 2026-09-15 版）一致的两行样式，再叠加共同的追加规则（响应式 / 圆点修正 / 运行时长）
source-file ~/.claude/tmux-status-stage-section.conf
source-file ~/.claude/tmux-status-extra.conf
