# 状态栏追加规则（2026-09-17，tz 与 biai 保持一致）：在两行样式之上叠加响应式与圆点修正；由 ~/.tmux.conf 末尾 source-file 引入。
# 宽 >= 100 列：与 stage 一致（额度在两行右侧），会话徽标下面显示整机 CPU / 内存。
# 宽 <  100 列：两行右侧都留空（两行滚动位置才一致，不错位）；额度改放第 2 行左侧（会话徽标正下方）——
#              窗口 <= 3 个时：第 1 行徽标 = 会话名截 11 格，第 2 行同宽显示紧凑额度「C95 F70 X47」（Claude / Fable / codex 已用%）；
#              窗口 >= 4 个时：第 1 行徽标只留「TZ」、第 2 行左侧留空、额度不显示（产品负责人：盖住就丢额度）。
# 注（tz tmux 3.4）：条件式的分支里再嵌条件式时，内层必须带显式的空 else（`,}`），否则整段渲染为空——这是圆点消失的原因；闪烁字符改由 tmux-claude-age.sh 算好写进 @busy_dot / @busy_dia。
# 另：Claude 分屏下派出的 codex exec 子进程（嵌套）显示灰色小菱形 ◇（@codex_sub，由 tmux-claude-age.sh 按进程树探测与清理，不计时长）——tz 试行，未同步 biai。
# 另（2026-09-24）：主 agent 派出的子代理在跑时，Claude 圆点（及时长）后面画紫色 ✦（2~9 个带上标数字 ✦²…✦⁹，更多 ✦⁹⁺；
#   @claude_sub_mark 由 tmux-claude-hook.sh 写入）。圆点只表示主 agent 自己：黄●+✦ = 主 agent 说完了、在等后台子代理，不用管。
#   配色：普通标签深底用浅紫 #cba6f7；当前窗口蓝底 #89b4fa 上浅紫看不见（对比度 1.0），改用深紫 #5b21b6（对比度 4.3）。
# 另：第 2 行对没跑 Claude / codex 但有子进程在跑的分屏显示「▶ 运行时长」（@run_age 由 tmux-claude-age.sh 写入）。
set -g @tab2     "#{s/^ //:#{P:#{?#{==:#{@claude_state},wait}, #[fg=#f9e2af]●,#{?#{==:#{@claude_state},busy}, #[fg=#89dceb]#{E:@busy_dot},}}#{?#{@claude_age},#[fg=#6c7086] #{@claude_age},}#{?#{@claude_sub_mark}, #[fg=#cba6f7]#{@claude_sub_mark},}#{?#{==:#{@codex_state},wait}, #[fg=#f9e2af]◆,#{?#{==:#{@codex_state},busy}, #[fg=#89dceb]#{E:@busy_dia},}}#{?#{@codex_age},#[fg=#6c7086] #{@codex_age},}#{?#{@codex_sub}, #[fg=#6c7086]◇,}#{?#{@run_age}, #[fg=#6c7086]▶ #{@run_age},}}}"
set -g @tab2_cur "#{s/^ //:#{P:#{?#{==:#{@claude_state},wait}, #[fg=#f9e2af]●,#{?#{==:#{@claude_state},busy}, #[fg=#0e7490]#{E:@busy_dot},}}#{?#{@claude_age},#[fg=#11111b] #{@claude_age},}#{?#{@claude_sub_mark}, #[fg=#5b21b6]#{@claude_sub_mark},}#{?#{==:#{@codex_state},wait}, #[fg=#f9e2af]◆,#{?#{==:#{@codex_state},busy}, #[fg=#0e7490]#{E:@busy_dia},}}#{?#{@codex_age},#[fg=#11111b] #{@codex_age},}#{?#{@codex_sub}, #[fg=#11111b]◇,}#{?#{@run_age}, #[fg=#11111b]▶ #{@run_age},}}}"
set -g status-left "#{?client_prefix,#[bg=#f9e2af]#[fg=#11111b]#[bold]  PREFIX #[default],#[bg=#313244]#[fg=#cdd6f4]#[bold] #{?#{e|<:#{client_width},100},#{?#{e|<=:#{session_windows},3},#{p11:#{=11:session_name}}, #{=2:session_name}}, #S} #[default]} "
set -g status-right "#{?#{e|<:#{client_width},100},,#(bash ~/.claude/tmux-claude-usage.sh codex)}"
# 2026-09-22:宽屏时会话徽标正下方显示整机 CPU / 内存(tmux-sysload.sh,替换原来的 tmux 运行时长;窄屏那格仍是紧凑额度)。
#   @sys_w   这一格可用格宽 = status-left 去样式后的格宽 - 3(末尾不着色的空格 1 + 与会话名对齐的前导空格 2)
#   @sys     脚本输出(超 80% 黄、超 90% 红,自带样式);@sys_txt 去样式版——按住 Prefix 时徽标变黄底,用它避免黄字压黄底,
#            也用它算补齐空格(p/ 不能直接用在带样式的串上)
set -g @sys_w   '#{e|-|:#{w:#{s/#\[[^]]*\]//:#{T:status-left}}},3}'
set -g @sys     '#(bash ~/.claude/tmux-sysload.sh #{E:@sys_w})'
set -g @sys_txt '#{s/#\[[^]]*\]//:#{E:@sys}}'
set -g status-format[1] '#[align=left]#{?client_prefix,#[bg=#f9e2af]#[fg=#11111b],#[bg=#313244]#[fg=#9399b2]}#{?#{e|<:#{client_width},100},#{p/#{e|-|:#{w:#{s/#\[[^]]*\]//:#{T:status-left}}},1}:#{?#{e|<=:#{session_windows},3}, #(bash ~/.claude/tmux-usage-compact.sh plain),}},  #{?client_prefix,#{E:@sys_txt},#{E:@sys}}#{p/#{e|-|:#{E:@sys_w},#{w:#{E:@sys_txt}}}:}}#[default] #[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} fg=#6c7086 bg=#1e1e2e] #{E:@tab2}#{E:@tab2_pad} #[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus fg=#11111b bg=#89b4fa] #{E:@tab2_cur}#{E:@tab2_pad} #[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right]#(bash ~/.claude/tmux-claude-age.sh)#{?#{e|<:#{client_width},100},,#(bash ~/.claude/tmux-claude-usage.sh claude)}'
