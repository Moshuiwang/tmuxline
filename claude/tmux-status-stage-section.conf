# ----------------- 6. 现代极简状态栏 -----------------
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#a6adc8"

# 左侧：Session 名称 & Prefix 激活指示器
set -g status-left-length 50
set -g status-left "#{?client_prefix,#[bg=#f9e2af]#[fg=#11111b]#[bold]  PREFIX #[default],#[bg=#313244]#[fg=#cdd6f4]#[bold]  #S #[default]} "

set -g status-justify left
# 窗口标签(两行高、两行等宽,点任一行都能切窗口):
#   第 1 行:#I:名字,后面依次是——
#     ⊞N 分屏数徽标(只在分屏数>1 时显示)  黄色Z(有分屏被最大化 zoom)
#   第 2 行:各分屏里 Claude / Codex 的状态指示器,按分屏顺序逐个渲染(2026-09-15 从第 1 行挪下来):
#     彩色点 = Claude 的状态(由 ~/.claude/tmux-claude-hook.sh 写入分屏变量 @claude_state):
#     青●干活中  黄●等你(回合完成/等输入/等授权);没跑 Claude 的分屏不显示点
#     Codex 使用独立的 @codex_state,显示为菱形,避免覆盖 Claude 的状态点:
#     青◆干活中  黄◆等你(回合完成/等授权);没跑 Codex 的分屏不显示菱形
#     点/菱形后面的数字 = 当前状态持续了多久(青=这一阵跑了多久 黄=等你多久),
#     分钟粒度、不足 1 分钟不显示、等你超 10 分钟变黄;由 ~/.claude/tmux-claude-age.sh 每 2 秒算好
#     写进 @claude_age / @codex_age(起点由两个钩子在状态切换时记录)。
#     干活中的青点/青菱形每 2 秒在实心与空心之间交替(闪 = 正在工作),开关 @blink 也由该脚本翻。
#     没跑 Claude/Codex 的窗口第 2 行留空。
# 两行要互相取宽度,所以标签正文放在用户选项里,window-status-*-format / status-format[1] 只套外框样式并补齐空格:
#   @tab / @tab_cur     第 1 行正文(非当前 / 当前窗口,只差配色,显示宽度相同)
#   @tab2 / @tab2_cur   第 2 行正文(同上;s/^ // 去掉分屏循环带出来的首个空格)
#   @tab_w / @tab2_w    两行正文的显示宽度(先用 s/#\[..\]// 去掉样式,再 w: 按格宽算)
#   @tab_max            两行取宽者;@tab_pad / @tab2_pad = 各行末尾要补的空格数(p/ 不能直接用在带样式的串上)
set -g @tab      "#I:#W#{?#{>:#{window_panes},1}, ⊞#{window_panes},}#{?window_zoomed_flag,#[fg=#f9e2af]Z,}"
set -g @tab_cur  "#I:#W#{?#{>:#{window_panes},1}, ⊞#{window_panes},}#{?window_zoomed_flag,#[fg=#b8860b]Z,}"
set -g @tab2     "#{s/^ //:#{P:#{?#{==:#{@claude_state},wait}, #[fg=#f9e2af]●,#{?#{==:#{@claude_state},busy}, #[fg=#89dceb]#{?#{==:#{@blink},1},●,○}}}#{?#{@claude_age},#[fg=#6c7086] #{@claude_age},}#{?#{==:#{@codex_state},wait}, #[fg=#f9e2af]◆,#{?#{==:#{@codex_state},busy}, #[fg=#89dceb]#{?#{==:#{@blink},1},◆,◇}}}#{?#{@codex_age},#[fg=#6c7086] #{@codex_age},}}}"
set -g @tab2_cur "#{s/^ //:#{P:#{?#{==:#{@claude_state},wait}, #[fg=#f9e2af]●,#{?#{==:#{@claude_state},busy}, #[fg=#89dceb]#{?#{==:#{@blink},1},●,○}}}#{?#{@claude_age},#[fg=#11111b] #{@claude_age},}#{?#{==:#{@codex_state},wait}, #[fg=#f9e2af]◆,#{?#{==:#{@codex_state},busy}, #[fg=#89dceb]#{?#{==:#{@blink},1},◆,◇}}}#{?#{@codex_age},#[fg=#11111b] #{@codex_age},}}}"
set -g @tab_w    '#{w:#{s/#\[[^]]*\]//:#{E:@tab}}}'
set -g @tab2_w   '#{w:#{s/#\[[^]]*\]//:#{E:@tab2}}}'
set -g @tab_max  '#{?#{e|>|:#{E:@tab2_w},#{E:@tab_w}},#{E:@tab2_w},#{E:@tab_w}}'
set -g @tab_pad  '#{p/#{e|-|:#{E:@tab_max},#{E:@tab_w}}:}'
set -g @tab2_pad '#{p/#{e|-|:#{E:@tab_max},#{E:@tab2_w}}:}'
setw -g window-status-format         "#[fg=#6c7086]#[bg=#1e1e2e] #{E:@tab}#{E:@tab_pad} "
setw -g window-status-current-format "#[fg=#11111b]#[bg=#89b4fa]#[bold] #{E:@tab_cur}#{E:@tab_pad} #[default]"
setw -g window-status-separator ""
# Codex / Claude 回合结束会响终端铃(bell)。monitor-bell on 让 tmux 把 BEL 转发给客户端(cmux/Ghostty 提醒);
# tmux 默认还会用 reverse 反色高亮响铃窗口,会把标签底色反过来——状态已由圆点/菱形表达,把样式改成 default 关掉高亮。
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off
setw -g window-status-bell-style default
setw -g window-status-activity-style default

# 状态栏两行(2026-09-15):
#   第 1 行 = session 徽标 + 窗口标签第 1 行 + 靠右的 Codex 额度(status-format[0] 用 tmux 默认值,右侧就是 status-right);
#   第 2 行 = 每个标签正下方同宽的第 2 行(Claude/Codex 状态指示器;当前窗口蓝底、其余同底色)+ 靠右的 Claude 额度。
# 第 2 行的每格自带 #[range=window|N],所以点两行里任一行都能切窗口——标签的可点击区域是两行高。
# 左侧徽标下面是一块同色色块,宽度 = status-left 去样式后的格宽减 1(末尾那个不着色的空格);按住 Prefix 时徽标变窄,这块跟着窄。
# 色块里的内容(宽屏整机 CPU / 内存、窄屏紧凑额度)由 tmux-status-extra.conf 覆盖本行时填入;09-22 前这里显示 tmux 运行时长,已去掉。
# 第 2 行的配色要和 window-status-*-format 保持一致(当前蓝底 #89b4fa 深字,其余底色 #1e1e2e 灰字)。
# 窗口多到一行放不下时两行滚动位置可能不一致(两行右侧额度段宽度不同)。
# 额度段由 tmux-claude-usage.sh 输出,参数 codex / claude 选段:第 1 行 Codex(蓝底)、第 2 行 Claude(橙底),
# 两块靠颜色区分,不显示产品名称和本地时钟。第 2 行开头先跑一次状态时长计时器(tmux-claude-age.sh,无输出)。
set -g status 2
set -g status-right-length 100
set -g status-right "#(bash ~/.claude/tmux-claude-usage.sh codex)"
set -g status-format[1] '#[align=left]#{?client_prefix,#[bg=#f9e2af]#[fg=#11111b],#[bg=#313244]#[fg=#9399b2]}#{p/#{e|-|:#{w:#{s/#\[[^]]*\]//:#{T:status-left}}},1}:}#[default] #[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} fg=#6c7086 bg=#1e1e2e] #{E:@tab2}#{E:@tab2_pad} #[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus fg=#11111b bg=#89b4fa] #{E:@tab2_cur}#{E:@tab2_pad} #[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right]#(bash ~/.claude/tmux-claude-age.sh)#(bash ~/.claude/tmux-claude-usage.sh claude)'
